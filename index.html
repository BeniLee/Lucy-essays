<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小作家作文集</title>
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>
  <header class="site-header">
    <h1>📝 小作家作文集</h1>
    <p class="subtitle">
      記錄每一個成長的字句
      <a href="write.html" style="margin-left:1rem;font-size:0.9rem;color:var(--accent);">✍️ 寫作文</a>
    </p>
  </header>

  <main class="container">
    <aside class="calendar-sidebar">
      <div class="calendar-header">
        <button id="prevMonth" class="cal-nav">‹</button>
        <h2 id="calMonthYear"></h2>
        <button id="nextMonth" class="cal-nav">›</button>
      </div>
      <div class="calendar-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
      <button id="calClearFilter" class="cal-clear hidden">顯示全部</button>
    </aside>

    <section class="main-content">
      <section class="search-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="搜尋作文標題或內容..."
          autocomplete="off"
        />
        <span id="resultCount" class="result-count"></span>
      </section>

      <section id="essayList" class="essay-list"></section>

      <div id="noResult" class="no-result hidden">
        😕 找不到符合的作文，試試其他關鍵字？
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>用心記錄，慢慢長大 ✨</p>
  </footer>

  <script src="js/app.js?v=2"></script>
</body>
</html>
